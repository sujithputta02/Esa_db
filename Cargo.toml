[package]
name = "esa-runtime"
version = "0.1.0"
edition = "2021"
authors = ["ESA Research Team"]
description = "Executable State Architecture - AI-Governed Autonomous Distributed State Runtime"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }
async-trait = "0.1"

# Distributed messaging
async-nats = "0.37"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
